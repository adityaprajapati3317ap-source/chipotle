<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get a $750 Garage Gift Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #fce7f3 0%, #fdf2f8 50%, #fce7f3 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(190, 24, 93, 0.12), 0 8px 20px rgba(0, 0, 0, 0.04);
      padding: 40px 36px 36px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #be185d;
      margin-bottom: 16px;
    }

    .logo span {
      font-size: 12px;
      vertical-align: super;
      margin-left: 2px;
    }

    .divider {
      height: 1px;
      background: #f9a8d4;
      margin: 0 auto 20px;
      width: 80%;
    }

    .amount {
      font-size: 56px;
      font-weight: 800;
      color: #be185d;
      line-height: 1;
      margin-bottom: 6px;
    }

    .exclusive {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #4b5563;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .steps {
      background: #fdf2f8;
      border-radius: 16px;
      padding: 20px 18px;
      margin-bottom: 28px;
      text-align: left;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .step:last-child {
      margin-bottom: 0;
    }

    .step-number {
      width: 28px;
      height: 28px;
      background: #be185d;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .step-text {
      font-size: 15px;
      color: #1f2937;
      font-weight: 500;
    }

    .cta {
      display: block;
      background: #be185d;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 16px 24px;
      border-radius: 14px;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .cta:hover {
      background: #9d174d;
      transform: translateY(-1px);
    }

    .cta:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GARAGE<span>®</span></div>
    <div class="divider"></div>
    <div class="amount">$750</div>
    <div class="exclusive">Exclusive Offer</div>

    <div class="steps">
      <div class="step">
        <div class="step-number">1</div>
        <div class="step-text">Click The Button Below</div>
      </div>
      <div class="step">
        <div class="step-number">2</div>
        <div class="step-text">Enter Your Basic Info</div>
      </div>
      <div class="step">
        <div class="step-number">3</div>
        <div class="step-text">Complete Required Offers</div>
      </div>
      <div class="step">
        <div class="step-number">4</div>
        <div class="step-text">Claim Your Reward</div>
      </div>
    </div>

    <a href="https://linkthem.net/?offer_id=3858&aff_id=145283" class="cta">CLAIM NOW →</a>
  </div>
</body>
</html>
